<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skin Detector</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <main class="app">
        <h2>AI Skin Disease Detector</h2>
        <p class="subtitle">Upload a clear, well-lit photo of the affected skin.</p>

        <label class="dropzone" id="dropzone">
            <input type="file" id="image" accept="image/*">
            <span class="title">Choose a photo</span>
            <span class="hint">or drag and drop it here</span>
            <img id="preview" alt="Selected photo preview">
        </label>
        <p id="fileName"></p>

        <button id="checkBtn" onclick="upload()">Check</button>

        <div class="loader" id="loader"></div>
        <div id="result" aria-live="polite"></div>
    </main>

    <script>
        const input = document.getElementById("image");
        const dropzone = document.getElementById("dropzone");
        const preview = document.getElementById("preview");
        const resultEl = document.getElementById("result");
        const loader = document.getElementById("loader");
        const btn = document.getElementById("checkBtn");

        /* ---------- Preview + drag and drop ---------- */
        function showPreview() {
            const file = input.files[0];
            if (!file) {
                dropzone.classList.remove("has-image");
                document.getElementById("fileName").textContent = "";
                return;
            }
            preview.src = URL.createObjectURL(file);
            dropzone.classList.add("has-image");
            document.getElementById("fileName").textContent = file.name;
            resultEl.innerHTML = "";
        }
        input.addEventListener("change", showPreview);

        ["dragenter", "dragover"].forEach(ev =>
            dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add("dragging"); }));
        ["dragleave", "drop"].forEach(ev =>
            dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove("dragging"); }));
        dropzone.addEventListener("drop", e => {
            if (e.dataTransfer.files.length) {
                input.files = e.dataTransfer.files;
                showPreview();
            }
        });

        /* ---------- Helpers ---------- */
        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        // Accepts 0-1 or 0-100, returns 0-100 (or null if missing)
        function toPercent(v) {
            if (v === undefined || v === null || isNaN(Number(v))) return null;
            v = Number(v);
            return Math.max(0, Math.min(100, v <= 1 ? v * 100 : v));
        }

        // Accepts [{label, confidence}] or {label: confidence}
        function normalizePredictions(p) {
            if (!p) return [];
            let list = Array.isArray(p)
                ? p.map(x => ({ label: x.label || x.disease || x.name, value: toPercent(x.confidence ?? x.probability ?? x.score) }))
                : Object.entries(p).map(([label, v]) => ({ label, value: toPercent(v) }));
            return list
                .filter(x => x.label && x.value !== null)
                .sort((a, b) => b.value - a.value)
                .slice(0, 5);
        }

        function showError(message) {
            resultEl.innerHTML = "";
            resultEl.appendChild(el("div", "error", message));
        }

        /* ---------- Render result ---------- */
        function renderResult(data) {
            const confidence = toPercent(data.confidence);
            const predictions = normalizePredictions(data.predictions);

            const card = el("div", "card");
            const head = el("div", "card-head");

            // Confidence gauge
            if (confidence !== null) {
                const gauge = el("div", "gauge");
                gauge.innerHTML =
                    '<svg viewBox="0 0 120 120" aria-hidden="true">' +
                    '<circle class="track" cx="60" cy="60" r="48"></circle>' +
                    '<circle class="fill" cx="60" cy="60" r="48"></circle></svg>';
                const value = el("div", "value", Math.round(confidence) + "%");
                value.appendChild(el("small", "", "confidence"));
                gauge.appendChild(value);
                head.appendChild(gauge);
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    gauge.querySelector(".fill").style.strokeDashoffset = 301.6 * (1 - confidence / 100);
                }));
            }

            // Diagnosis
            const diag = el("div", "diagnosis");
            diag.appendChild(el("div", "label", "Most likely condition"));
            diag.appendChild(el("div", "name", data.disease));
            if (confidence !== null) {
                const low = confidence < 60;
                diag.appendChild(el("span", "badge" + (low ? " low" : ""),
                    low ? "Low confidence, see a doctor" : confidence >= 85 ? "High confidence" : "Moderate confidence"));
            }
            head.appendChild(diag);
            card.appendChild(head);

            // Prediction bars
            if (predictions.length > 1) {
                card.appendChild(el("div", "section-title", "Other possibilities"));
                const bars = el("div", "bars");
                predictions.forEach((p, i) => {
                    const row = el("div", "bar-row" + (i === 0 ? " top" : ""));
                    const label = el("div", "bar-label");
                    label.appendChild(el("span", "", p.label));
                    label.appendChild(el("span", "", p.value.toFixed(1) + "%"));
                    const track = el("div", "bar-track");
                    const fill = el("div", "bar-fill");
                    track.appendChild(fill);
                    row.appendChild(label);
                    row.appendChild(track);
                    bars.appendChild(row);
                    requestAnimationFrame(() => requestAnimationFrame(() => {
                        fill.style.width = p.value + "%";
                    }));
                });
                card.appendChild(bars);
            }

            // Details
            if (data.details) {
                card.appendChild(el("div", "section-title", "About this condition"));
                card.appendChild(el("p", "details", data.details));
            }

            card.appendChild(el("p", "disclaimer",
                "This is an AI estimate, not a medical diagnosis. Please consult a dermatologist."));

            resultEl.innerHTML = "";
            resultEl.appendChild(card);
        }

        /* ---------- Upload ---------- */
        function upload() {
            let file = input.files[0];

            if (!file) {
                showError("Please select an image first!");
                return;
            }

            // Show loader
            loader.classList.add("show");
            resultEl.innerHTML = "";
            btn.disabled = true;

            let formData = new FormData();
            formData.append("image", file);

            fetch("/predict", {
                method: "POST",
                body: formData
            })
                .then(res => res.json())
                .then(data => {
                    loader.classList.remove("show");
                    btn.disabled = false;

                    if (data.error) {
                        showError("Error: " + data.error);
                    } else {
                        renderResult(data);
                    }
                })
                .catch(error => {
                    loader.classList.remove("show");
                    btn.disabled = false;
                    showError("Error: " + error.message);
                });
        }
    </script>
</body>

</html>
